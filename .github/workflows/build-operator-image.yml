name: Build and Publish Operator Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/operator

jobs:
  build-operator:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - testnet
          - mainnet

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract versions from Makefile
        id: versions
        run: |
          OPERATOR_VERSION=$(grep '^OPERATOR_VERSION=' Makefile | cut -d'=' -f2)
          EIGEN_SDK_TESTNET=$(grep '^EIGEN_SDK_GO_VERSION_TESTNET=' Makefile | cut -d'=' -f2)
          EIGEN_SDK_MAINNET=$(grep '^EIGEN_SDK_GO_VERSION_MAINNET=' Makefile | cut -d'=' -f2)
          echo "operator_version=${OPERATOR_VERSION}" >> $GITHUB_OUTPUT
          echo "eigen_sdk_testnet=${EIGEN_SDK_TESTNET}" >> $GITHUB_OUTPUT
          echo "eigen_sdk_mainnet=${EIGEN_SDK_MAINNET}" >> $GITHUB_OUTPUT
          echo "=== Build Configuration ==="
          echo "Operator version: ${OPERATOR_VERSION}"
          echo "EigenSDK testnet: ${EIGEN_SDK_TESTNET}"
          echo "EigenSDK mainnet: ${EIGEN_SDK_MAINNET}"
          echo "Environment: ${{ matrix.environment }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.environment }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push operator image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/ey-alignedlayer.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=operator-${{ matrix.environment }}
          cache-to: type=gha,mode=max,scope=operator-${{ matrix.environment }}
          build-args: |
            ENVIRONMENT=${{ matrix.environment }}
            BUILDARCH=amd64

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.environment }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
